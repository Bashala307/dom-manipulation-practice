<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #27272a; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  
            scrollbar-width: none; 
        }

        .app-wrapper {
            width: 100%;
            max-width: 28rem; 
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-box {
            background-color: #060606;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 32px;
        }

        .list-container {
            background-color: #161616;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 32px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-height: 75vh;
            overflow-y: auto;
        }

        .task-card {
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-align: left;
            border: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        
        .task-card.true { background-color: #006c17; }
        .task-card.false { background-color: #101010; }

        .task-info { display: flex; flex-direction: column; }
        .task-priority { font-size: 0.75rem; opacity: 0.6; margin-top: 0.2rem; }
        
        .delete-btn {
            font-size: 1.25rem;
            font-weight: bold;
            margin-left: 1rem;
            padding: 0.25rem;
            transition: color 0.2s;
        }
        .delete-btn:hover { color: #f43f5e; /* rose-500 */ }

     
        .fab-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background-color: black;
            color: white;
            z-index: 10;
            padding: 1rem 1.5rem;
            border-radius: 9999px;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

       
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100vh;
            background-color: rgba(22, 22, 22, 0.6);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: rgba(22, 22, 22, 0.95);
            width: 90%;
            max-width: 28rem;
            height: 40vh;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            border-radius: 32px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-header {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { font-weight: bold; margin-left: 28%; }
        .close-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            width: 100%;
        }

        .task-input {
            width: 100%;
            height: 20%;
            min-height: 40px;
            padding-left: 1rem;
            color: black;
            border-radius: 1rem;
            border: none;
            outline: none;
        }

        .radio-group { margin: 0.5rem 0; line-height: 1.8; }
        .radio-group label { margin-left: 0.5rem; cursor: pointer; }

        .submit-btn {
            padding: 1rem 2rem;
            background-color: #059669;
            color: white;
            border-radius: 1rem;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: #047857; }

        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="totalNumber" class="stat-box">
            <p>Виконано: 0 завдань</p>
        </div>
        
        <div class="list-container">
            <div id="historyList" class="task-list no-scrollbar">
                </div>
        </div>

        <button id="openModalBtn" class="fab-btn">+</button>
    </div>

    <div id="modalWindow" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <p class="modal-title">Додати завдання</p>
                <button id="closeModalBtn" class="close-btn">✕</button>
            </div>
            
            <div class="modal-body">
                <input id="taskText" type="text" class="task-input" placeholder="Що треба зробити?">
                
                <div>
                    <form id="form" class="radio-group">
                        <input type="radio" id="dterminovo" name="priority" value="ДУЖЕ ТЕРМІНОВО" checked>
                        <label for="dterminovo">ДУЖЕ ТЕРМІНОВО</label><br>
                        
                        <input type="radio" id="terminovo" name="priority" value="Терміново">
                        <label for="terminovo">Терміново</label><br>
                        
                        <input type="radio" id="nterminovo" name="priority" value="Не терміново">
                        <label for="nterminovo">Не терміново</label>
                    </form>
                </div>
                
                <button id="pushButton" class="submit-btn">Прикріпити</button>
            </div>
        </div>
    </div>
   
    <script>
        let historyTasks = JSON.parse(localStorage.getItem('tasks_data')) || [];
        
        historyLoad();

        function historyLoad() {
            render();
            itemsRefresh();
        }

        function render() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            historyTasks.forEach(item => {
                const card = document.createElement("button");
                card.className = `task-card ${item.completed || false}`;
                
                const textStyle = item.completed ? 'text-decoration-line: line-through;' : '';

                card.innerHTML = `
                    <div class="task-info" style="${textStyle}">
                        <span>${item.nameOf}</span>
                        <span class="task-priority">Пріоритет: ${item.priority}</span>
                    </div>
                    <span class="delete-btn">✕</span>
                `;

                card.addEventListener('click', (event) => {
                    if (event.target.classList.contains('delete-btn')) {
                        historyTasks = historyTasks.filter(task => task !== item);
                        saveData();
                        render();
                        itemsRefresh();
                        return; 
                    }

                    item.completed = !item.completed;
                    saveData();
                    itemsRefresh();
                    render();
                });

                historyList.appendChild(card);
            });
        } 

        function saveData() {
            localStorage.setItem('tasks_data', JSON.stringify(historyTasks));
        }

        function itemsRefresh() {
            const completedCount = historyTasks.filter(item => item.completed).length;
            document.getElementById('totalNumber').innerText = `Виконано: ${completedCount} завдань`;
        }
        
        document.getElementById("openModalBtn").addEventListener("click", () => {
            document.getElementById("modalWindow").classList.remove("hidden");
        });

        document.getElementById("closeModalBtn").addEventListener("click", () => {
            document.getElementById("modalWindow").classList.add("hidden");
        });

        document.getElementById("pushButton").addEventListener("click", () => {
            const textInput = document.getElementById('taskText').value.trim();
            if(!textInput) return; 

            const tasks = {
                nameOf: textInput,
                priority: document.querySelector('input[name="priority"]:checked').value,
                completed: false
            };
            
            historyTasks.push(tasks);
            saveData();
            render();
            
            
            document.getElementById('taskText').value = '';
            document.getElementById("modalWindow").classList.add("hidden");
        });
    </script>
</body>
</html>
